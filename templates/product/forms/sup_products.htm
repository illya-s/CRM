<form method="POST" >
	{% csrf_token %}
	<h1>Авторизация</h1>

	{% for field in form %}
		{% if field.errors %}
			<ul class="errorlist">
				{% for error in field.errors %}
				<li>{{ error }}</li>
				{% endfor %}
			</ul>
		{% endif %}

		{{ field }}
	{% endfor %}

	<button type="submit">Войти</button>
</form>
