{% extends "base.htm" %}
{% load static %}


{% block style %}
<link rel="stylesheet" href="{% static 'css/pagination.css' %}">
<link rel="stylesheet" href="{% static 'css/top_menu.css' %}">
<link rel="stylesheet" href="{% static 'css/order/orders.css' %}">
<link rel="stylesheet" href="{% static 'css/order/order_list.css' %}">
<meta name="page" content="{{ page }}">
<meta name="del" content="{% url 'del_orders' %}">
{% endblock %}


{% block content %}

<div class="top-menu">
	<p>Заказы</p>
	<select class="top-menu-select" name="" id="EPP">
		<option value="25">25</option>
		<option value="50">50</option>
		<option value="100">100</option>
	</select>
	<a href="{% url 'create_order' %}" class="top-add-btn add-order-btn" id="addOrderBtn">
		<svg width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
			<rect x="14" width="5" height="34" rx="2.5" fill="#FFF"/>
			<rect y="19" width="5" height="34" rx="2.5" transform="rotate(-90 0 19)" fill="#FFF"/>
		</svg>
	</a>
</div>
<div class="order-list list-cont" data-url="{% url 'order_list' %}"></div>
<div class="pagination" id="pagination"></div>



<div class="edit-menu-wraper">
	<!-- <button class="edit-menu-btn" id="export">Export</button> -->
	<button class="edit-menu-btn" id="del_orders">DELETE</button>
</div>

{% endblock %}

{% block script %}
<script src="{% static 'js/list.js' %}"></script>
<script src="{% static 'js/order/orders.js' %}"></script>
{% endblock %}
